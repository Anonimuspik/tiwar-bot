name: Tiwar Auto-Hunt Bot

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npx playwright install chromium

      - name: Run bot
        env:
          COOKIES_JSON_1: ${{ secrets.COOKIES_JSON_1 }}
          COOKIES_JSON_2: ${{ secrets.COOKIES_JSON_2 }}
        run: node bot.js
