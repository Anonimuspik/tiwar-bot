name: Tiwar Auto-Hunt Bot (FAST)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}

      - name: Cache Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run bot
        env:
          COOKIES_JSON_1: ${{ secrets.COOKIES_JSON_1 }}
          COOKIES_JSON_2: ${{ secrets.COOKIES_JSON_2 }}
          COOKIES_JSON_3: ${{ secrets.COOKIES_JSON_3 }}
          COOKIES_JSON_4: ${{ secrets.COOKIES_JSON_4 }}
          COOKIES_JSON_5: ${{ secrets.COOKIES_JSON_5 }}
        run: node bot.js
