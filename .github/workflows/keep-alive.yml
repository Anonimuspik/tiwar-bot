name: Tiwar Auto-Hunt Bot

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    strategy:
      matrix:
        account: [1, 2]
      fail-fast: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run bot
        env:
          ACCOUNT_INDEX: ${{ matrix.account }}
          COOKIES_JSON_1: ${{ secrets.COOKIES_JSON_1 }}
          COOKIES_JSON_2: ${{ secrets.COOKIES_JSON_2 }}
        run: node bot.js
