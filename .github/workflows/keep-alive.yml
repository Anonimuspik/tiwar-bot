name: Tiwar Auto-Hunt Bot (fast)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # кеш node_modules (ускоряет npm install)
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      # кеш playwright браузеров
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright

      - name: Install dependencies
        run: npm install

      # устанавливаем браузер ОДИН РАЗ
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run bot (all accounts)
        env:
          COOKIES_JSON_1: ${{ secrets.COOKIES_JSON_1 }}
          COOKIES_JSON_2: ${{ secrets.COOKIES_JSON_2 }}
          COOKIES_JSON_3: ${{ secrets.COOKIES_JSON_3 }}
          COOKIES_JSON_4: ${{ secrets.COOKIES_JSON_4 }}
          COOKIES_JSON_5: ${{ secrets.COOKIES_JSON_5 }}
        run: node bot.js
